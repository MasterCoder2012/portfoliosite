<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Logs</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px;
      margin: 0;
      background-color: black;
      color: red;
      cursor: crosshair;
    }

    #logs-card {
      background-color: black;
      color: red;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px red;
      width: 95%;
      max-width: 1400px;
      text-align: center;
      border: 2pt solid red;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(40px, 7vw, 80px);
    }

    #toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    #search {
      padding: 10px;
      width: 300px;
      max-width: 100%;
      border-radius: 10px;
      color: red;
      background-color: black;
      border: 2pt solid red;
      outline: none;
    }

    #search:focus {
      box-shadow: 0 0 10px red;
    }

    #log-count {
      font-size: 16px;
    }

    #table-container {
      width: 100%;
      overflow-x: auto;
      border: 1pt solid red;
      border-radius: 8px;
      overflow-y: auto;
      max-height: 90%
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
    }

    th, td {
      border: 1pt solid red;
      padding: 9px 10px;
      background-color: black;
      color: red;
      text-align: left;
    }

    th {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      background-color: #180000;
      box-shadow: inset 0 -2px 0 red;
    }

    th::after {
      content: " ↕";
      font-size: 12px;
    }

    tr:hover td {
      background-color: #180000;
    }

    #msg {
      color: red;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      #logs-card {
        width: 100%;
        padding: 15px;
      }

      #toolbar {
        justify-content: center;
      }

      #search {
        width: 100%;
      }

      th, td {
        padding: 7px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div id="logs-card">
    <h1>Visitor Logs</h1>

    <div id="toolbar">
      <input type="text" id="search" placeholder="Search logs...">
      <span id="log-count">0 logs</span>
    </div>

    <div id="table-container">
      <table id="log-table">
        <thead>
          <tr>
            <th data-column="0">ID</th>
            <th data-column="1">IP</th>
            <th data-column="2">Page</th>
            <th data-column="3">Consent</th>
            <th data-column="4">Time</th>
            <th data-column="5">User Agent</th>
            <th data-column="6">Referrer</th>
            <th data-column="7">Language</th>
            <th data-column="8">Device</th>
          </tr>
        </thead>

        <tbody></tbody>
      </table>
    </div>

    <p id="msg"></p>
  </div>

  <script>
    let logs = JSON.parse(sessionStorage.getItem("logsData") || "[]");
    let filteredLogs = [...logs];

    let sortColumn = null;
    let sortDirection = 1;

    const tbody = document.querySelector("#log-table tbody");
    const search = document.getElementById("search");
    const logCount = document.getElementById("log-count");
    const msg = document.getElementById("msg");

    function displayLogs() {
      tbody.innerHTML = "";

      filteredLogs.forEach(row => {
        const tr = document.createElement("tr");

        Object.values(row).forEach(val => {
          const td = document.createElement("td");

          td.textContent = val ?? "";

          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      logCount.textContent =
        filteredLogs.length +
        (filteredLogs.length === 1 ? " log" : " logs");
    }

    function sortLogs(column) {
      if (sortColumn === column) {
        sortDirection *= -1;
      } else {
        sortColumn = column;
        sortDirection = 1;
      }

      filteredLogs.sort((a, b) => {
        const valuesA = Object.values(a);
        const valuesB = Object.values(b);

        const valueA = String(
          valuesA[column] ?? ""
        ).toLowerCase();

        const valueB = String(
          valuesB[column] ?? ""
        ).toLowerCase();

        return (
          valueA.localeCompare(
            valueB,
            undefined,
            {
              numeric: true,
              sensitivity: "base"
            }
          ) * sortDirection
        );
      });

      displayLogs();
    }

    document.querySelectorAll("th").forEach(th => {
      th.onclick = () => {
        sortLogs(Number(th.dataset.column));
      };
    });

    search.oninput = () => {
      const query = search.value.toLowerCase();

      filteredLogs = logs.filter(row =>
        Object.values(row).some(value =>
          String(value ?? "")
            .toLowerCase()
            .includes(query)
        )
      );

      displayLogs();
    };

    function loadLogs() {
      if (!logs.length) {
        document.getElementById("logs-card").innerHTML =
          "<h2>Unauthorized or session expired</h2>";

        return;
      }

      displayLogs();
    }

    loadLogs();
  </script>
</body>
</html>
